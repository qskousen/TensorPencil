name: Build and Release

# Linux and Windows x86-64, both cross-compiled on Ubuntu against the prebuilt libvips
# and FFmpeg packages `build.zig.zon` pins (-Dbundle-libs on Linux, always on Windows),
# whose libraries install beside the executables: nothing is taken from the system but
# glibc, which the Linux build asks no newer than 2.31 of. macOS is not built: there is
# no Metal backend, and no Mac build has been run.
#
# The binaries need an x86-64-v3 CPU (AVX2, FMA): ggml's kernels are built with AVX2
# whatever -Dcpu says, so asking for less would only slow the Zig code.
#
# A tag push tests, builds both and drafts a release; a manual run stops after the
# build, and the zips are the run's artifacts. Nothing runs on an ordinary push.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libvips-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libx11-dev libxcursor-dev libxi-dev libwayland-dev

      # The debug test binaries fill about 2.8 GB of cache. Past the default 2 GB
      # limit setup-zig clears the whole cache before saving, so every run would
      # compile from scratch.
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 4096

      # Zig 0.17 keeps packages in `zig-pkg/`, which setup-zig does not cache. Each job
      # keys its own copy, since each fetches a different set; a changed
      # build.zig.zon still restores the last copy and fetches only what is new.
      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: zig-pkg
          key: zig-pkg-test-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-pkg-test-

      # A fresh runner downloads every package at once, and GitHub sometimes drops one
      # of those connections (HttpConnectionClosing). Listing the steps runs the build
      # script, which fetches what these flags need and compiles nothing, so a retry
      # can only ever repeat a download; what already arrived is kept.
      - name: Fetch dependencies
        run: |
          for i in 1 2 3; do
            zig build -l > /dev/null && exit 0
            echo "fetch attempt $i failed"; sleep 20
          done
          exit 1

      # The gated suite (-Dintegration) needs a GPU and real checkpoints, so it
      # cannot run here. This is the CPU unit suite only.
      - name: Unit tests
        run: zig build test

      - name: GUI tests
        run: zig build gui-test

      # tp-gui's failure modes are visual: this renders the whole workspace from
      # canned data with no model, GPU or engine, so a crash or a layout blowup
      # shows up without a display.
      - name: UI probe renders
        run: |
          zig build ui-probe -- ui.png
          zig build ui-probe -- ui-states.png --states
          test -s ui.png && test -s ui-states.png

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: -Dtarget=x86_64-linux-gnu.2.31 -Dbundle-libs
          - name: windows-x86_64
            target: -Dtarget=x86_64-windows-gnu

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      # `cache-key` gives each target its own build cache; without it both legs
      # share the job's one entry and each restores the other's.
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-key: ${{ matrix.name }}
          cache-size-limit: 4096

      # See the test job's steps of the same names.
      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: zig-pkg
          key: zig-pkg-${{ matrix.name }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-pkg-${{ matrix.name }}-

      - name: Fetch dependencies
        run: |
          for i in 1 2 3; do
            zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v3 ${{ matrix.target }} -l > /dev/null && exit 0
            echo "fetch attempt $i failed"; sleep 20
          done
          exit 1

      - name: Build
        run: |
          zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v3 ${{ matrix.target }} --prefix out
          zig build gui -Doptimize=ReleaseFast -Dcpu=x86_64_v3 ${{ matrix.target }} --prefix out

      - name: Package
        run: tools/package_release.sh ${{ matrix.name }} out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/tensorpencil-${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/tensorpencil-*.zip
          draft: true
          generate_release_notes: true
          body: |
            Both builds need an x86-64 CPU with AVX2, and carry their own libvips and
            FFmpeg (a GPL build, for its H.264 encoder) beside the executables; their
            licenses are in `licenses/`.

            **Windows:** unzip and run `tp-gui.exe`.

            **Linux:** unzip and run `tp-gui`. Needs glibc 2.31 or newer (Ubuntu 20.04,
            Debian 11 and later).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
